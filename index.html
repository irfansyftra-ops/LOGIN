<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIMASENA - Login</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        softBg: '#F4F6F4',
                        cardBg: '#FFFFFF',
                        primarySage: '#78907A',
                        primaryHover: '#627A64',
                        textDark: '#2C3E30',
                        textMuted: '#7F8C8D',
                        inputBg: '#FAFCFA',
                        borderColor: '#E2E8E2'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #F4F6F4 0%, #EAEFEA 100%);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Custom Modal/Message Box (Replaces alert) -->
    <div id="messageModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden items-center justify-center z-50 transition-opacity duration-300">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full mx-4 shadow-xl border border-borderColor transform scale-95 transition-transform duration-300" id="modalContent">
            <div class="flex items-center space-x-3 mb-4">
                <div id="modalIcon" class="w-10 h-10 rounded-full bg-softBg flex items-center justify-center text-primarySage text-lg">
                    <i class="fa-solid fa-check"></i>
                </div>
                <h3 id="modalTitle" class="text-lg font-semibold text-textDark">Notifikasi</h3>
            </div>
            <p id="modalMessage" class="text-textMuted text-sm mb-6">Pesan informasi akan muncul di sini.</p>
            <div class="flex justify-end">
                <button onclick="closeModal()" class="px-5 py-2 bg-primarySage text-white text-sm font-medium rounded-xl hover:bg-primaryHover transition-all shadow-sm">
                    Mengerti
                </button>
            </div>
        </div>
    </div>

    <div class="w-full max-w-md mx-auto">
        
        <!-- Branding Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-primarySage text-white text-2xl font-bold shadow-md mb-3 transform hover:rotate-6 transition-transform duration-300">
                B
            </div>
            <h1 class="text-2xl font-bold tracking-wider text-textDark">BIMASENA</h1>
            <p class="text-sm text-textMuted mt-1">Masuk untuk mengakses akun Anda</p>
        </div>

        <!-- Login Card -->
        <div class="glass-card rounded-3xl p-8 shadow-xl border border-white/60">
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-5">
                
                <!-- Email / Username Input -->
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-textMuted mb-2" for="email">
                        Email atau Username
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-textMuted pointer-events-none">
                            <i class="fa-regular fa-envelope text-sm"></i>
                        </span>
                        <input type="text" id="email" required
                            class="w-full pl-11 pr-4 py-3 bg-inputBg border border-borderColor rounded-xl text-textDark text-sm focus:outline-none focus:ring-2 focus:ring-primarySage/50 focus:border-primarySage transition-all"
                            placeholder="nama@email.com atau username">
                    </div>
                </div>

                <!-- Password Input -->
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-textMuted mb-2" for="password">
                        Kata Sandi
                    </label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-textMuted pointer-events-none">
                            <i class="fa-solid fa-lock text-sm"></i>
                        </span>
                        <input type="password" id="password" required
                            class="w-full pl-11 pr-12 py-3 bg-inputBg border border-borderColor rounded-xl text-textDark text-sm focus:outline-none focus:ring-2 focus:ring-primarySage/50 focus:border-primarySage transition-all"
                            placeholder="••••••••">
                        <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 pr-4 flex items-center text-textMuted hover:text-textDark focus:outline-none">
                            <i id="eyeIcon" class="fa-regular fa-eye text-sm"></i>
                        </button>
                    </div>
                </div>

                <!-- Remember Me & Forgot Password -->
                <div class="flex items-center justify-between text-sm">
                    <label class="flex items-center space-x-2 cursor-pointer select-none">
                        <input type="checkbox" id="remember" class="w-4 h-4 rounded border-borderColor text-primarySage focus:ring-primarySage/50 accent-primarySage cursor-pointer">
                        <span class="text-textMuted text-xs">Ingat saya</span>
                    </label>
                    <a href="#" onclick="showForgotModal(event)" class="text-xs font-medium text-primarySage hover:text-primaryHover transition-colors">
                        Lupa kata sandi?
                    </a>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="w-full py-3 px-4 bg-primarySage text-white font-medium rounded-xl hover:bg-primaryHover active:scale-[0.99] transition-all shadow-md shadow-primarySage/20 flex items-center justify-center space-x-2">
                    <span>Masuk</span>
                    <i class="fa-solid fa-arrow-right text-xs"></i>
                </button>

                <!-- Divider -->
                <div class="relative flex py-2 items-center">
                    <div class="flex-grow border-t border-borderColor"></div>
                    <span class="flex-shrink mx-4 text-xs text-textMuted uppercase tracking-wider">Atau masuk dengan</span>
                    <div class="flex-grow border-t border-borderColor"></div>
                </div>

                <!-- Social Logins -->
                <div class="grid grid-cols-2 gap-3">
                    <button type="button" onclick="socialLogin('Google')" class="flex items-center justify-center py-2.5 px-4 border border-borderColor rounded-xl bg-white hover:bg-inputBg transition-all text-xs font-medium text-textDark shadow-sm">
                        <i class="fa-brands fa-google text-red-500 mr-2 text-sm"></i> Google
                    </button>
                    <button type="button" onclick="socialLogin('GitHub')" class="flex items-center justify-center py-2.5 px-4 border border-borderColor rounded-xl bg-white hover:bg-inputBg transition-all text-xs font-medium text-textDark shadow-sm">
                        <i class="fa-brands fa-github text-gray-800 mr-2 text-sm"></i> GitHub
                    </button>
                </div>
            </form>

            <!-- Register Link -->
            <p class="text-center text-xs text-textMuted mt-6">
                Belum punya akun BIMASENA? 
                <a href="#" onclick="showRegisterNotice(event)" class="font-semibold text-primarySage hover:text-primaryHover transition-colors">Daftar sekarang</a>
            </p>
        </div>

        <!-- Footer Note -->
        <p class="text-center text-[11px] text-textMuted mt-6">
            &copy; 2026 BIMASENA. Seluruh hak cipta dilindungi.
        </p>
    </div>

    <script>
        // Toggle password visibility
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }

        // Custom Modal Functions (Replacing alert)
        function showModal(title, message, isSuccess = true) {
            const modal = document.getElementById('messageModal');
            const modalContent = document.getElementById('modalContent');
            const modalTitle = document.getElementById('modalTitle');
            const modalMessage = document.getElementById('modalMessage');
            const modalIcon = document.getElementById('modalIcon');

            modalTitle.textContent = title;
            modalMessage.textContent = message;

            if (isSuccess) {
                modalIcon.innerHTML = '<i class="fa-solid fa-check"></i>';
                modalIcon.className = 'w-10 h-10 rounded-full bg-emerald-50 flex items-center justify-center text-emerald-600 text-lg';
            } else {
                modalIcon.innerHTML = '<i class="fa-solid fa-info"></i>';
                modalIcon.className = 'w-10 h-10 rounded-full bg-amber-50 flex items-center justify-center text-amber-600 text-lg';
            }

            modal.classList.remove('hidden');
            modal.classList.add('flex');
            setTimeout(() => {
                modalContent.classList.remove('scale-95');
                modalContent.classList.add('scale-100');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('messageModal');
            const modalContent = document.getElementById('modalContent');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            setTimeout(() => {
                modal.classList.remove('flex');
                modal.classList.add('hidden');
            }, 200);
        }

        // Form Submission Handler
        function handleLogin(event) {
            event.preventDefault();
            const email = document.getElementById('email').value;
            showModal('Berhasil Masuk!', `Selamat datang kembali, ${email}! Anda berhasil masuk ke ekosistem BIMASENA.`, true);
        }

        // Forgot Password Link Handler
        function showForgotModal(event) {
            event.preventDefault();
            showModal('Pemulihan Sandi', 'Instruksi pemulihan kata sandi telah dikirimkan ke email terdaftar Anda (simulasi).', false);
        }

        // Register Link Handler
        function showRegisterNotice(event) {
            event.preventDefault();
            showModal('Pendaftaran Akun', 'Fitur pendaftaran akun baru BIMASENA akan segera dibuka.', false);
        }

        // Social Login Handler
        function socialLogin(provider) {
            showModal(`Autentikasi ${provider}`, `Menghubungkan ke server autentikasi ${provider}...`, true);
        }
    </script>
</body>
</html>
